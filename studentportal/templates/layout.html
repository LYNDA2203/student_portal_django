<!DOCTYPE html>
<html lang="en">

{% load static %}

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block title %}
            STUDENT PORTAL APP
        {% endblock %}
    </title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    
</head>
<body background="static/image/students_image.png">
    <nav>
       <a href="/" style="text-decoration: none;">
            <span role="img" aria-label="Home" title="Home">🏠</span>
        </a> | 
        {% if user.is_authenticated %}
         <a href="/login" style="text-decoration: none;">
            <span role="img" aria-label="login" title = "login">🚪🏃‍♂️</span>
        </a> 
       
        {% endif %} 
       
         <a href="{% url 'register' %}" style="text-decoration: none;">
            <span role="img" aria-label="register" title = "register">®️</span>
        </a>  
    </nav>
    {% block content %}


    {% endblock %}
</body>
</html>
