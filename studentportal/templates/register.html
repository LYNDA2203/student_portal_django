{% extends "layout.html" %}
{% load static %}
{% block title %}
    REGISTER PAGE
{% endblock %}

{% block content %}
  <div class="container">
    <h1>Register a New User</h1>
    <form class="form-width-validation" action="{% url 'register' %}" method="post">
        {% csrf_token %}

        <div class="form-group">
            <label for="id_username">Username:</label>
            {{ form.username }}
        </div>

        <div class="form-group">
            <label for="id_email">Email:</label>
            {{ form.email }}
        </div>

        <div class="form-group">
            <label for="id_password1">Password:</label>
            {{ form.password1 }}
        </div>

        <div class="form-group">
            <label for="id_password2">Confirm Password:</label>
            {{ form.password2 }}
        </div>

        <div class="form-group">
            <label>Role:</label>
            {{ form.role }}  <!-- This shows "Student / Mentor" -->
        </div>

        <button class="form-submit">Submit</button>
    </form> 
  </div> 

{% endblock %}
